<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#d4a8c8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <title>¿Niño o Niña? — Rasca y Descubre</title>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      touch-action: none;
      overscroll-behavior: none;
      height: 100%;
    }

    body {
      position: fixed; inset: 0;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      display: flex;
      flex-direction: column;
      /* Fondo degradado azul → rosa */
      background: linear-gradient(160deg, #a8d4ec 0%, #c8a8d8 40%, #e8a8bc 100%);
      -webkit-user-select: none; user-select: none;
      font-family: -apple-system, 'Segoe UI', sans-serif;
    }

    /* ══════════════════════════════════════
       CABECERA
    ══════════════════════════════════════ */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5vmin 3vmin 1vmin;
      background: rgba(255,250,248,0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.4);
    }

    .balloon {
      height: 9vmin;
      max-height: 60px;
      object-fit: contain;
      flex-shrink: 0;
      mix-blend-mode: multiply;
    }

    .header-center {
      flex: 1;
      text-align: center;
      padding: 0 2vmin;
      line-height: 1;
    }

    .title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.3rem, 6.5vmin, 3rem);
      white-space: nowrap;
    }
    .t-q    { color: #7a5030; }
    .t-nino { color: #1a70c0; }
    .t-o    { color: #7a5030; }
    .t-nina { color: #c02060; }

    .subtitle {
      font-size: clamp(0.38rem, 1.6vmin, 0.65rem);
      letter-spacing: 0.15em;
      color: #7a5030;
      font-weight: 700;
      margin-top: 0.5vmin;
    }

    /* En landscape el subtítulo ocupa demasiado espacio — lo ocultamos */
    @media (orientation: landscape) {
      .subtitle { display: none; }
      .balloon  { height: 7vmin; max-height: 48px; }
    }

    /* ══════════════════════════════════════
       ZONA PRINCIPAL (GRID + MASCOTAS)
    ══════════════════════════════════════ */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.8vmin;
      gap: 1vmin;
    }

    /* Mascotas: solo visibles en landscape, en los lados del grid */
    .mascot {
      display: none;
      flex-shrink: 0;
      object-fit: contain;
      object-position: bottom center;
      mix-blend-mode: multiply;
    }
    @media (orientation: landscape) {
      .mascot {
        display: block;
        width: 9vw;
        max-width: 80px;
        height: 100%;
        max-height: 200px;
      }
    }

    /* ══════════════════════════════════════
       GRID DE CÍRCULOS
       Portrait → 2 col × 4 fil
       Landscape → 4 col × 2 fil
       Las variables --cell y --gap las calcula JS
    ══════════════════════════════════════ */
    .circles-grid {
      display: grid;
      /* Valor por defecto; JS lo sobreescribe con --cell y --cols */
      grid-template-columns: repeat(var(--cols, 2), var(--cell, 140px));
      gap: var(--gap, 8px);
    }

    /* ══════════════════════════════════════
       CELDA CIRCULAR
    ══════════════════════════════════════ */
    .circle-cell {
      width:  var(--cell, 140px);
      height: var(--cell, 140px);
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      touch-action: none;
      box-shadow:
        0 5px 14px rgba(0,0,0,0.26),
        inset 0 2px 5px rgba(255,255,255,0.35),
        inset 0 -2px 5px rgba(0,0,0,0.10);
    }

    /* Imagen del icono (fondo) */
    .icon-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* Capa de revelado de género (último círculo) */
    .gender-layer {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4%;
    }
    .gender-layer.boy  { background: radial-gradient(circle at 38% 35%, #90caf9, #1565c0); }
    .gender-layer.girl { background: radial-gradient(circle at 38% 35%, #f48fb1, #880e4f); }
    .g-icon  { font-size: 2.2em; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
    .g-label { font-size: .6em; font-weight: 900; color: #fff; letter-spacing: .05em; text-shadow: 0 1px 4px rgba(0,0,0,.4); }

    /* Canvas de rascado (encima de todo) */
    .scratch {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    /* ══════════════════════════════════════
       CONFETI
    ══════════════════════════════════════ */
    #confetti {
      display: none; position: fixed; inset: 0;
      pointer-events: none; z-index: 999;
    }
    #confetti.active { display: block; }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header class="header">
    <img src="icons/balloon_blue.png" class="balloon" alt="">
    <div class="header-center">
      <div class="title">
        <span class="t-q">¿&nbsp;</span><span class="t-nino">Niño</span><span class="t-o">&nbsp;o&nbsp;</span><span class="t-nina">Niña</span><span class="t-q">&nbsp;?</span>
      </div>
      <p class="subtitle">— RASCA Y DESCUBRE EL SEXO DEL BEBÉ —</p>
    </div>
    <img src="icons/balloon_pink.png" class="balloon" alt="">
  </header>

  <!-- Zona principal -->
  <div class="main">
    <img src="icons/bear.png"  class="mascot" alt="">

    <div class="circles-grid" id="grid">
      <div class="circle-cell"><img src="icons/icon1.png" class="icon-img"><canvas class="scratch"></canvas></div>
      <div class="circle-cell"><img src="icons/icon2.png" class="icon-img"><canvas class="scratch"></canvas></div>
      <div class="circle-cell"><img src="icons/icon3.png" class="icon-img"><canvas class="scratch"></canvas></div>
      <div class="circle-cell"><img src="icons/icon4.png" class="icon-img"><canvas class="scratch"></canvas></div>
      <div class="circle-cell"><img src="icons/icon5.png" class="icon-img"><canvas class="scratch"></canvas></div>
      <div class="circle-cell"><img src="icons/icon6.png" class="icon-img"><canvas class="scratch"></canvas></div>
      <div class="circle-cell"><img src="icons/icon7.png" class="icon-img"><canvas class="scratch"></canvas></div>
      <!-- Último círculo: configurable niño/niña -->
      <div class="circle-cell" id="last-cell">
        <img src="icons/icon8.png" class="icon-img" id="last-icon">
        <canvas class="scratch"></canvas>
      </div>
    </div>

    <img src="icons/bunny.png" class="mascot" alt="">
  </div>

  <canvas id="confetti"></canvas>

  <script>
  // ═══════════════════════════════════════════════════════════
  //  ✏️  GÉNERO DEL BEBÉ
  //  Cambia 'unknown' por 'boy' o 'girl',
  //  o usa la URL: ?gender=boy  /  ?gender=girl
  // ═══════════════════════════════════════════════════════════
  const GENDER_FALLBACK = 'unknown';
  // ═══════════════════════════════════════════════════════════

  const urlGender  = new URLSearchParams(location.search).get('gender');
  const BABY_GENDER = ['boy','girl'].includes(urlGender) ? urlGender : GENDER_FALLBACK;

  // Aplicar icono de niña si está configurado
  if (BABY_GENDER === 'girl') {
    document.getElementById('last-icon').src = 'icons/icon8_girl.png';
  }

  // ─── Layout dinámico ──────────────────────────────────────
  const root = document.documentElement;
  const dpr  = window.devicePixelRatio || 1;

  function updateLayout() {
    const landscape = window.innerWidth > window.innerHeight;
    const cols = landscape ? 4 : 2;
    const rows = landscape ? 2 : 4;

    // Espacio disponible (descontando cabecera y padding)
    const header  = document.querySelector('.header');
    const headerH = header.getBoundingClientRect().height;
    const PAD     = Math.min(14, window.innerWidth * 0.025);

    let availW = window.innerWidth  - PAD * 2;
    let availH = window.innerHeight - headerH - PAD * 2;

    // En landscape, las mascotas consumen ~9vw en cada lado
    if (landscape) availW -= Math.min(160, window.innerWidth * 0.18) + PAD;

    const GAP = Math.round(Math.max(5, Math.min(12, availW * 0.025)));

    // Tamaño de celda = el menor de: ancho disponible÷cols, alto disponible÷filas
    const byW = (availW - GAP * (cols - 1)) / cols;
    const byH = (availH - GAP * (rows - 1)) / rows;
    const cell = Math.floor(Math.min(byW, byH));

    root.style.setProperty('--cols', cols);
    root.style.setProperty('--cell', cell + 'px');
    root.style.setProperty('--gap',  GAP  + 'px');

    // Re-pintar canvases con nuevo tamaño
    requestAnimationFrame(() => {
      canvases.forEach(c => { if (!c._done) initCanvas(c, cell); });
    });
  }

  // ─── Canvas ───────────────────────────────────────────────
  const canvases = [...document.querySelectorAll('.scratch')];

  function initCanvas(canvas, cell) {
    const size = Math.round(cell * dpr);
    canvas.width  = size;
    canvas.height = size;
    drawGold(canvas);
  }

  function drawGold(canvas) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2, r = W / 2;

    ctx.clearRect(0, 0, W, H);

    // Degradado dorado con iluminación superior-izquierda
    const g = ctx.createRadialGradient(cx * .65, cy * .60, r * .03, cx, cy, r);
    g.addColorStop(0.00, '#FFFAAA');
    g.addColorStop(0.18, '#FFE000');
    g.addColorStop(0.45, '#FFB300');
    g.addColorStop(0.75, '#E07800');
    g.addColorStop(1.00, '#7A4500');

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();

    // Brillo
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx * .64, cy * .58, r * .26, r * .16, -.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fill();
    ctx.restore();

    // Borde interior oscuro (relieve)
    ctx.beginPath();
    ctx.arc(cx, cy, r - dpr, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(80,35,0,.18)';
    ctx.lineWidth = dpr * 2;
    ctx.stroke();

    // Estrella decorativa
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(80,35,0,.40)';
    ctx.font = `bold ${r * .44}px sans-serif`;
    ctx.fillText('✦', cx, cy);
  }

  function attachScratch(canvas) {
    const ctx = canvas.getContext('2d');
    let active = false;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const s = e.touches ? e.touches[0] : e;
      return {
        x: (s.clientX - rect.left) * dpr,
        y: (s.clientY - rect.top)  * dpr,
      };
    }

    function erase(e) {
      if (!active || canvas._done) return;
      e.preventDefault();
      const { x, y } = getPos(e);
      const r = canvas.width / 2;
      // Pincel: mínimo 22px CSS, o 42% del radio
      const brushR = Math.max(22 * dpr, r * .42);
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, brushR, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      checkReveal(canvas, r);
    }

    canvas.addEventListener('mousedown',  e => { active = true;  erase(e); });
    canvas.addEventListener('mousemove',  erase);
    canvas.addEventListener('mouseup',    () => active = false);
    canvas.addEventListener('mouseleave', () => active = false);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); active = true;  erase(e); }, { passive: false });
    canvas.addEventListener('touchmove',  e => { e.preventDefault(); erase(e); },                 { passive: false });
    canvas.addEventListener('touchend',   () => active = false);
  }

  function checkReveal(canvas, r) {
    if (canvas._done) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    const data = ctx.getImageData(0, 0, W, H).data;
    let inside = 0, gone = 0;
    for (let i = 0; i < data.length; i += 16) {
      const pi = i >> 2;
      const px = pi % W, py = (pi / W) | 0;
      if ((px - cx) ** 2 + (py - cy) ** 2 <= r * r) {
        inside++;
        if (data[i + 3] < 128) gone++;
      }
    }
    if (inside > 0 && gone / inside > .55) {
      canvas._done = true;
      canvas.style.transition = 'opacity .55s ease';
      canvas.style.opacity = '0';
      setTimeout(() => { canvas.style.display = 'none'; }, 560);
      if (canvases.every(c => c._done)) celebrate();
    }
  }

  // ─── Init ─────────────────────────────────────────────────
  document.fonts.ready.then(() => {
    updateLayout();
    canvases.forEach(c => attachScratch(c));
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(updateLayout, 150);
  });

  // ─── Bloquear scroll / zoom / doble-tap ───────────────────
  document.addEventListener('touchstart', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchmove', e => {
    e.preventDefault();
  }, { passive: false });

  let lastTap = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTap < 300) e.preventDefault();
    lastTap = now;
  }, { passive: false });

  // ─── Confeti ──────────────────────────────────────────────
  function celebrate() {
    const cel = document.getElementById('confetti');
    cel.width  = window.innerWidth;
    cel.height = window.innerHeight;
    cel.classList.add('active');
    const ctx    = cel.getContext('2d');
    const colors = ['#FFD700','#FF69B4','#87CEEB','#98FB98','#FFB6C1','#DDA0DD','#FF8C00','#FFF'];
    const pieces = Array.from({ length: 150 }, () => ({
      x: Math.random() * cel.width,
      y: -20 - Math.random() * cel.height * .5,
      w: 7 + Math.random() * 10,
      h: 4 + Math.random() * 6,
      color: colors[(Math.random() * colors.length) | 0],
      a: Math.random() * Math.PI * 2,
      spin: (Math.random() - .5) * .2,
      vy: 2.5 + Math.random() * 4,
      vx: (Math.random() - .5) * 2.5,
      op: 1,
    }));
    let frame = 0;
    (function tick() {
      ctx.clearRect(0, 0, cel.width, cel.height);
      frame++;
      let alive = false;
      for (const p of pieces) {
        p.x += p.vx; p.y += p.vy; p.a += p.spin;
        if (frame > 100) p.op = Math.max(0, p.op - .013);
        if (p.y < cel.height + 30) alive = true;
        ctx.save();
        ctx.globalAlpha = p.op;
        ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
        ctx.rotate(p.a);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (alive && frame < 320) requestAnimationFrame(tick);
      else cel.classList.remove('active');
    })();
  }
  </script>
</body>
</html>
