<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#fce4ec">
  <title>¿Niño o Niña? — Rasca y Descubre</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #fce4ec 0%, #e8f4fd 100%);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    /* ─── Game wrapper ─────────────────────────────── */
    #game {
      position: relative;
      /* Image is 3:2 → max width respecting both axes:
         width ≤ 100vw  AND  height = width*(2/3) ≤ 100vh → width ≤ 150vh */
      width: min(100vw, 150vh);
    }

    #bg-image {
      display: block;
      width: 100%; height: auto;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      border-radius: 12px;
    }

    /* ─── Each scratch card ───────────────────────── */
    .card {
      position: absolute;
      border-radius: 50%;
      overflow: hidden;
      /* Cards are injected by JS */
    }

    /* Gender reveal layer (only circle 8 when gender is configured) */
    .gender-reveal {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      gap: 2%;
    }
    .gender-reveal.boy  { background: radial-gradient(circle at 38% 35%, #b3e5fc, #0277bd); }
    .gender-reveal.girl { background: radial-gradient(circle at 38% 35%, #f8bbd0, #ad1457); }

    .gender-reveal .g-icon {
      font-size: 2.4em;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    }
    .gender-reveal .g-label {
      font-size: 0.62em;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    /* Scratch canvas sits on top inside .card */
    .scratch-canvas {
      position: absolute;
      inset: 0;
      touch-action: none;
      cursor: crosshair;
    }

    /* ─── Portrait hint ───────────────────────────── */
    #portrait-hint {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,10,30,0.92);
      z-index: 900;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    .ph-icon {
      font-size: 3.5rem;
      animation: tilt 1.6s ease-in-out infinite alternate;
    }
    @keyframes tilt {
      from { transform: rotate(0deg); }
      to   { transform: rotate(90deg); }
    }
    .ph-text { font-size: 1.05rem; max-width: 270px; line-height: 1.5; }
    .ph-btn {
      margin-top: 0.5rem;
      padding: 0.55rem 1.4rem;
      border: 1.5px solid rgba(255,255,255,0.45);
      background: transparent;
      color: #fff;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    @media (orientation: portrait) { #portrait-hint { display: flex; } }

    /* ─── Confetti canvas ─────────────────────────── */
    #confetti {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 800;
    }
    #confetti.active { display: block; }

    /* ─── Debug mode ──────────────────────────────── */
    .debug-circle {
      position: absolute;
      border-radius: 50%;
      border: 3px dashed red;
      background: rgba(255,0,0,0.15);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Portrait orientation reminder -->
  <div id="portrait-hint">
    <div class="ph-icon">📱</div>
    <p class="ph-text">Gira tu dispositivo en <strong>horizontal</strong> para la mejor experiencia</p>
    <button class="ph-btn" onclick="document.getElementById('portrait-hint').style.display='none'">
      Continuar de todas formas
    </button>
  </div>

  <!-- Game -->
  <div id="game">
    <img id="bg-image" src="rasca.png" alt="¿Niño o Niña? Rasca y descubre" draggable="false">
    <!-- .card elements injected by JS -->
  </div>

  <!-- Confetti -->
  <canvas id="confetti"></canvas>

  <script>
    // ═══════════════════════════════════════════════════════════════
    //  ✏️  CONFIGURACIÓN DEL GÉNERO
    //
    //  Opciones:
    //    'unknown'  →  Al raspar se ve la imagen (sin revelar nada extra)
    //    'boy'      →  Al raspar el último círculo aparece ¡ES NIÑO! (azul)
    //    'girl'     →  Al raspar el último círculo aparece ¡ES NIÑA! (rosa)
    //
    //  También puedes configurarlo por URL sin tocar el código:
    //    ?gender=boy   o   ?gender=girl
    // ═══════════════════════════════════════════════════════════════
    const GENDER_FALLBACK = 'unknown'; // ← cambia aquí si prefieres
    // ═══════════════════════════════════════════════════════════════

    const params      = new URLSearchParams(location.search);
    const BABY_GENDER = (['boy','girl'].includes(params.get('gender')))
                        ? params.get('gender')
                        : GENDER_FALLBACK;

    const DEBUG = params.has('debug'); // ?debug para calibrar posiciones

    // ─── Posiciones de los círculos ────────────────────────────────
    //  cx / cy  →  centro como fracción del ANCHO / ALTO de la imagen
    //  r        →  radio como fracción del ANCHO de la imagen
    //
    //  Ajusta estos valores si los óvalos dorados no cuadran.
    //  Truco: añade ?debug a la URL para ver los círculos en rojo.
    // ──────────────────────────────────────────────────────────────
    const CIRCLES = [
      { cx: 0.190, cy: 0.548, r: 0.082 }, // 1 - body (body)
      { cx: 0.376, cy: 0.548, r: 0.082 }, // 2 - corona
      { cx: 0.561, cy: 0.548, r: 0.082 }, // 3 - biberón
      { cx: 0.747, cy: 0.548, r: 0.082 }, // 4 - vestido
      { cx: 0.190, cy: 0.786, r: 0.082 }, // 5 - babero
      { cx: 0.376, cy: 0.786, r: 0.082 }, // 6 - globo corazón
      { cx: 0.561, cy: 0.786, r: 0.082 }, // 7 - nube
      { cx: 0.747, cy: 0.786, r: 0.082 }, // 8 - zapatillas ← configurable
    ];

    // ─── State ─────────────────────────────────────────────────────
    const img   = document.getElementById('bg-image');
    const game  = document.getElementById('game');
    let cards = [];

    // ─── Build / rebuild cards ─────────────────────────────────────
    function buildCards(preserveRevealed = []) {
      cards.forEach(c => c.remove());
      cards = [];

      const iw  = img.offsetWidth;
      const ih  = img.offsetHeight;
      const dpr = window.devicePixelRatio || 1;

      CIRCLES.forEach((def, i) => {
        const pxCx = def.cx * iw;
        const pyCy = def.cy * ih;
        const pxR  = def.r  * iw;
        const side = pxR * 2;

        if (DEBUG) {
          const dbg = document.createElement('div');
          dbg.className = 'debug-circle';
          Object.assign(dbg.style, {
            left: (pxCx - pxR) + 'px', top: (pyCy - pxR) + 'px',
            width: side + 'px', height: side + 'px',
          });
          game.appendChild(dbg);
        }

        const card = document.createElement('div');
        card.className = 'card';
        Object.assign(card.style, {
          left:   (pxCx - pxR) + 'px',
          top:    (pyCy - pxR) + 'px',
          width:  side + 'px',
          height: side + 'px',
        });

        // Last circle → gender reveal layer (below the scratch canvas)
        if (i === CIRCLES.length - 1 && BABY_GENDER !== 'unknown') {
          const reveal = document.createElement('div');
          const isGirl = BABY_GENDER === 'girl';
          reveal.className = `gender-reveal ${BABY_GENDER}`;
          reveal.innerHTML = `
            <span class="g-icon">${isGirl ? '👧' : '👦'}</span>
            <span class="g-label">${isGirl ? '¡ES NIÑA!' : '¡ES NIÑO!'}</span>
          `;
          card.appendChild(reveal);
        }

        // Scratch canvas (on top)
        const canvas = document.createElement('canvas');
        canvas.className = 'scratch-canvas';
        canvas.width  = side * dpr;
        canvas.height = side * dpr;
        canvas.style.width  = side + 'px';
        canvas.style.height = side + 'px';

        if (preserveRevealed[i]) {
          canvas._done = true;
          canvas.style.display = 'none';
        } else {
          drawGold(canvas, dpr);
          attachScratch(canvas, i, pxR, dpr);
        }

        card.appendChild(canvas);
        game.appendChild(card);
        cards.push(card);
      });
    }

    // ─── Draw the gold circle on a canvas ─────────────────────────
    function drawGold(canvas, dpr) {
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const cx = W / 2, cy = H / 2, r = W / 2;

      const g = ctx.createRadialGradient(cx * 0.68, cy * 0.62, r * 0.04, cx, cy, r);
      g.addColorStop(0.00, '#FFF7AA');
      g.addColorStop(0.20, '#FFD700');
      g.addColorStop(0.55, '#FFA500');
      g.addColorStop(1.00, '#8B6000');

      ctx.beginPath();
      ctx.arc(cx, cy, r - dpr, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();

      // Shine spot
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx * 0.66, cy * 0.60, r * 0.24, r * 0.15, -0.6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.52)';
      ctx.fill();
      ctx.restore();

      // Star hint
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(100,55,0,0.50)';
      ctx.font = `bold ${r * 0.44}px sans-serif`;
      ctx.fillText('✦', cx, cy);
    }

    // ─── Wire up scratch events ────────────────────────────────────
    function attachScratch(canvas, index, radiusPx, dpr) {
      const ctx = canvas.getContext('2d');
      let active = false;

      function xy(e) {
        const r = canvas.getBoundingClientRect();
        const s = e.touches ? e.touches[0] : e;
        return { x: (s.clientX - r.left) * dpr, y: (s.clientY - r.top) * dpr };
      }

      function erase(e) {
        if (!active || canvas._done) return;
        e.preventDefault();
        const { x, y } = xy(e);
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, radiusPx * dpr * 0.24, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        sampleReveal(canvas, index, radiusPx * dpr);
      }

      canvas.addEventListener('mousedown',  e => { active = true;  erase(e); });
      canvas.addEventListener('mousemove',  e => { erase(e); });
      canvas.addEventListener('mouseup',    ()  => { active = false; });
      canvas.addEventListener('mouseleave', ()  => { active = false; });
      canvas.addEventListener('touchstart', e => { e.preventDefault(); active = true;  erase(e); }, { passive: false });
      canvas.addEventListener('touchmove',  e => { e.preventDefault(); erase(e); },                 { passive: false });
      canvas.addEventListener('touchend',   ()  => { active = false; });
    }

    // ─── Sample pixels to decide if revealed ──────────────────────
    function sampleReveal(canvas, index, r) {
      if (canvas._done) return;
      const ctx  = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const cx = W / 2, cy = H / 2;
      const data = ctx.getImageData(0, 0, W, H).data;

      let inside = 0, gone = 0;
      // Sample every 4th pixel for performance
      for (let i = 0; i < data.length; i += 16) {
        const pi = i >> 2;
        const px = pi % W, py = (pi / W) | 0;
        if ((px - cx) ** 2 + (py - cy) ** 2 <= r * r) {
          inside++;
          if (data[i + 3] < 128) gone++;
        }
      }

      if (inside > 0 && gone / inside > 0.55) reveal(canvas, index);
    }

    // ─── Reveal a circle ──────────────────────────────────────────
    function reveal(canvas, index) {
      if (canvas._done) return;
      canvas._done = true;
      canvas.style.transition = 'opacity 0.55s ease';
      canvas.style.opacity = '0';
      setTimeout(() => { canvas.style.display = 'none'; }, 560);
      checkAllRevealed();
    }

    function checkAllRevealed() {
      const allDone = cards.every(card => {
        const c = card.querySelector('.scratch-canvas');
        return c && c._done;
      });
      if (allDone) celebrate();
    }

    // ─── Confetti celebration ──────────────────────────────────────
    function celebrate() {
      const cel = document.getElementById('confetti');
      cel.width  = window.innerWidth;
      cel.height = window.innerHeight;
      cel.classList.add('active');

      const ctx    = cel.getContext('2d');
      const colors = ['#FFD700','#FF69B4','#87CEEB','#98FB98','#FFB6C1','#DDA0DD','#FF8C00'];
      const pieces = Array.from({ length: 130 }, () => ({
        x: Math.random() * cel.width,
        y: -20 - Math.random() * cel.height * 0.6,
        w: 7 + Math.random() * 9, h: 4 + Math.random() * 5,
        color: colors[(Math.random() * colors.length) | 0],
        a: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.18,
        vy: 2.5 + Math.random() * 3.5,
        vx: (Math.random() - 0.5) * 2.5,
        opacity: 1,
      }));

      let frame = 0;
      function tick() {
        ctx.clearRect(0, 0, cel.width, cel.height);
        frame++;
        let alive = false;
        for (const p of pieces) {
          p.x += p.vx; p.y += p.vy; p.a += p.spin;
          if (frame > 120) p.opacity = Math.max(0, p.opacity - 0.012);
          if (p.y < cel.height + 30) alive = true;
          ctx.save();
          ctx.globalAlpha = p.opacity;
          ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
          ctx.rotate(p.a);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        if (alive && frame < 300) requestAnimationFrame(tick);
        else cel.classList.remove('active');
      }
      requestAnimationFrame(tick);
    }

    // ─── Init ──────────────────────────────────────────────────────
    function init() { buildCards([]); }

    img.complete && img.naturalWidth > 0 ? init() : img.addEventListener('load', init);

    // Rebuild on resize (preserve revealed state)
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const revealed = cards.map(card => {
          const c = card.querySelector('.scratch-canvas');
          return !!(c && c._done);
        });
        buildCards(revealed);
      }, 200);
    });
  </script>
</body>
</html>
